name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleOfflineDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log to commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed at commit ${GITHUB_SHA::7}"
            echo '```text'
            tail -n 150 build.log
            echo '```'
          } > comment_body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$(cat comment_body.md)"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/offline/debug/*.apk
