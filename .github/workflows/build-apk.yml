name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleOfflineDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log to commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed at commit ${GITHUB_SHA::7}"
            echo '### Key error lines'
            grep -nE "FAILURE|What went wrong|Caused by|error:|Error:|Execution failed|A problem occurred|> Task.*FAILED|reason:|Unresolved|e: " build.log | head -60
            echo '### Log head 40'
            head -n 40 build.log
            echo '### Log tail 80'
            tail -n 80 build.log
          } > comment_body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$(cat comment_body.md)"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/offline/debug/*.apk
          retention-days: 14
